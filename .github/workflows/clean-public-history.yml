name: Clean public example history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'MikeInNY/ha-map-card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - name: Sanitize fork commits and release tags
        shell: python
        run: |
          """Rewrite only this fork's added commits and two release tags with generic fixtures."""
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          
          
          def git(*args, data=None, env=None):
              return subprocess.check_output(['git', *args], input=data, env=env).strip()
          
          
          base = '0f2c9f9731f5869f660f6fa41d0665aeae477616'
          first = 'e9287a93ec3ed25566bc63acb230f35a5d2fec25'
          refs = ['refs/heads/main', 'refs/tags/v1.16.0-refocus.1', 'refs/tags/v1.16.0-refocus.2']
          heads = git('for-each-ref', '--format=%(refname)', 'refs/remotes/origin').decode().splitlines()
          assert set(heads) <= {'refs/remotes/origin/main', 'refs/remotes/origin/HEAD'}, 'Unexpected branches; review required'
          old = {ref: git('rev-parse', ref).decode() for ref in refs}
          readme = git('show', first + ':README.md')
          section = readme.split(b'### Refocus only when the focused entity moves', 1)[1]
          name = re.search(rb'focus_entity: person\.([A-Za-z_]+)', section).group(1)
          assert name != b'example'
          pattern = re.compile(rb'(?<![A-Za-z_])' + re.escape(name) + rb'(?![A-Za-z_])', re.I)
          commits = git('rev-list', '--reverse', '--topo-order', base + '..' + old[refs[0]]).decode().splitlines()
          assert all(value in commits for value in old.values()), 'Release outside expected history'
          mapping = {base: base}
          with tempfile.TemporaryDirectory() as tmp:
              env = dict(os.environ, GIT_INDEX_FILE=str(Path(tmp) / 'index'))
              for commit in commits:
                  parents = git('show', '-s', '--format=%P', commit).decode().split()
                  assert all(parent in mapping for parent in parents), 'Unexpected ancestry'
                  git('read-tree', commit, env=env)
                  entries = git('ls-tree', '-r', '-z', commit).split(b'\0')
                  for entry in entries:
                      if not entry:
                          continue
                      metadata, path = entry.split(b'\t', 1)
                      mode, kind, blob = metadata.split()
                      if kind != b'blob' or not path.endswith((b'.js', b'.md', b'.yaml', b'.yml', b'.json')):
                          continue
                      content = subprocess.check_output(['git', 'cat-file', 'blob', blob.decode()])
                      if not pattern.search(content):
                          continue
                      clean = pattern.sub(lambda m: b'Example' if m[0][:1].isupper() else b'example', content)
                      new_blob = git('hash-object', '-w', '--stdin', data=clean).decode()
                      git('update-index', '--add', '--cacheinfo', mode.decode(), new_blob, path.decode(), env=env)
                  tree = git('write-tree', env=env).decode()
                  author = git('show', '-s', '--format=%an%n%ae%n%aI%n%cn%n%ce%n%cI', commit).decode().splitlines()
                  commit_env = dict(env)
                  for key, value in zip(['GIT_AUTHOR_NAME', 'GIT_AUTHOR_EMAIL', 'GIT_AUTHOR_DATE',
                                         'GIT_COMMITTER_NAME', 'GIT_COMMITTER_EMAIL', 'GIT_COMMITTER_DATE'], author):
                      commit_env[key] = value
                  message = git('show', '-s', '--format=%B', commit)
                  message = pattern.sub(b'example', message)
                  args = ['commit-tree', tree]
                  for parent in parents:
                      args += ['-p', mapping[parent]]
                  mapping[commit] = git(*args, data=message + b'\n', env=commit_env).decode()
          
              # Verify before changing any remote reference. Never print matched content.
              for commit in mapping.values():
                  if commit == base:
                      continue
                  result = subprocess.run(['git', 'grep', '-i', '-l', '-w', name.decode(), commit, '--',
                                           'README.md', 'src'], stdout=subprocess.PIPE)
                  assert result.returncode == 1, 'Privacy verification failed'
              args = ['push', '--atomic', 'origin']
              for ref, value in old.items():
                  args += ['--force-with-lease=' + ref + ':' + value]
              args += [mapping[value] + ':' + ref for ref, value in old.items()]
              git(*args)
              for ref, value in old.items():
                  assert git('ls-remote', 'origin', ref).split()[0].decode() == mapping[value]
              print('Sanitized main and both release tags; remote references verified.')
              print('GitHub Support may still need to purge cached and unreferenced commits.')
